# Activated only when SPRING_PROFILES_ACTIVE=prod is set (see docker-compose.yml
# and .env.example). Values here are layered on top of application.yml.
#
# This file intentionally does not exist in the default profile, so a plain
# `docker compose up` (no .env, no SPRING_PROFILES_ACTIVE) never touches SMTP
# config at all and keeps working exactly as it does today.

app:
  otp:
    # Never echo OTPs in API responses in production - they must only ever
    # reach the user via the real email sent below.
    dev-mode: false
  mail:
    from: ${MAIL_FROM}

spring:
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
