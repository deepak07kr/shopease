apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: shopease-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shopease-frontend
  template:
    metadata:
      labels:
        app: shopease-frontend
    spec:
      containers:
        - name: frontend
          image: shopease-frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  labels:
    app: shopease-frontend
spec:
  type: LoadBalancer # Or NodePort for local minikube/kind
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
  selector:
    app: shopease-frontend
