# Kubernetes Secret TEMPLATE - safe to commit to GitHub.
#
# This file contains NO real credentials. All real values live in `.env`
# (gitignored). Apply the REAL secret locally / on your cluster with:
#
#   kubectl create secret generic shopease-secret \
#     --from-env-file=.env \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# (run from the repo root, where .env lives)
#
# Every key listed below must exist in .env. If a key is missing, the pod
# will fail with CreateContainerConfigError.
apiVersion: v1
kind: Secret
metadata:
  name: shopease-secret
  labels:
    app: shopease
type: Opaque
# Placeholder values only - overridden by the kubectl command above.
# NEVER put real credentials in this file; it is pushed to GitHub.
stringData:
  DB_USERNAME: "REPLACE_FROM_.ENV"
  DB_PASSWORD: "REPLACE_FROM_.ENV"
  MYSQL_ROOT_PASSWORD: "REPLACE_FROM_.ENV"
  JWT_SECRET: "REPLACE_FROM_.ENV"
  RAZORPAY_KEY_ID: "REPLACE_FROM_.ENV"
  RAZORPAY_KEY_SECRET: "REPLACE_FROM_.ENV"
  # Product image uploads/CDN - cloudinary://<api_key>:<api_secret>@<cloud_name>
  CLOUDINARY_URL: "REPLACE_FROM_.ENV"
  # SMTP for OTP emails (Brevo). Port 2525 works on Render (25/465/587 blocked).
  SMTP_HOST: "REPLACE_FROM_.ENV"
  SMTP_PORT: "REPLACE_FROM_.ENV"
  SMTP_USERNAME: "REPLACE_FROM_.ENV"
  SMTP_PASSWORD: "REPLACE_FROM_.ENV"
  MAIL_FROM: "REPLACE_FROM_.ENV"
